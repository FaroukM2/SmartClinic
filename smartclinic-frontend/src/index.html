  <!-- Schema.org JSON-LD Structured Data for Medical SEO -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "SoftwareApplication",
        "@id": "https://smartclinic.com/#software",
        "name": "SmartClinic Healthcare OS",
        "applicationCategory": "HealthCareApplication",
        "operatingSystem": "Web Cloud SaaS",
        "description": "Multi-tenant clinical platform providing Electronic Medical Records (EMR), queue synchronization, and automated invoicing.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      },
      {
        "@type": "MedicalClinic",
        "@id": "https://smartclinic.com/#clinic",
        "name": "SmartClinic Medical Centers Network",
        "url": "http://localhost:4200",
        "medicalSpecialty": [
          "Cardiology",
          "Pediatrics",
          "Orthopedics",
          "Dermatology"
        ],
        "availableService": [
          {
            "@type": "MedicalProcedure",
            "name": "Clinical Specialty Consultation"
          },
          {
            "@type": "MedicalProcedure",
            "name": "Electronic Medical Records & Prescriptions"
          }
        ],
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Downtown Central Health District",
          "addressLocality": "Cairo",
          "addressCountry": "EG"
        }
      }
    ]
  }
  </script>

  <!-- Early Theme Persistence Bootstrapper -->
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('smartclinic_theme');
        if (savedTheme === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        } else if (savedTheme === 'dark') {
          document.documentElement.removeAttribute('data-theme');
        }
      } catch (e) {}
    })();
  </script>
